services:
  postgres:
    image: postgres:16-alpine
    container_name: booknest-postgres
    environment:
      POSTGRES_DB: booknest_db
      POSTGRES_USER: booknest_user
      POSTGRES_PASSWORD: booknest_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U booknest_user -d booknest_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
