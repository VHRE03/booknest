# Configuracion de tests: H2 en memoria en modo PostgreSQL, no requiere Docker
spring.application.name=booknest

spring.datasource.url=jdbc:h2:mem:booknest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

openapi.server.url=http://localhost:8080
openapi.server.description=Servidor de Tests
