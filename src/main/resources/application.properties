# Nombre de la aplicacion
spring.application.name=booknest

# Puerto del servicio
server.port=${SERVER_PORT:8080}

# Base de datos PostgreSQL (docker-compose.yml levanta la base con estos mismos valores)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booknest_db}
spring.datasource.username=${DB_USER:booknest_user}
spring.datasource.password=${DB_PASSWORD:booknest_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate: 'update' crea/actualiza el esquema automaticamente en local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Se exige que todo acceso lazy ocurra dentro del service (patron DTO)
spring.jpa.open-in-view=false

# Configuracion global de Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# OpenAPI: URL que usan los "Try it out" del Swagger UI
openapi.server.url=http://localhost:8080
openapi.server.description=Servidor Local
